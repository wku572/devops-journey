name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python
        run: flake8 --max-line-length=100 week4-python week6-compose

      - name: Check Bash syntax
        run: |
          for f in week2-bash/*.sh; do
            bash -n "$f"
          done

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build fetch-github image
        run: docker build -t fetch-github week4-python

      - name: Build compose web image
        run: docker build -t compose-web week6-compose
