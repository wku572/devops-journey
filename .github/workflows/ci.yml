name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python
        run: flake8 --max-line-length=100 week4-python week6-compose

      - name: Check Bash syntax
        run: |
          for f in week2-bash/*.sh; do
            bash -n "$f"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r week4-python/requirements.txt pytest

      - name: Run tests
        run: pytest week4-python -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test, terraform]
    steps:
      - uses: actions/checkout@v4

      - name: Build fetch-github image
        run: docker build -t fetch-github week4-python

      - name: Build compose web image
        run: docker build -t compose-web week6-compose

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: week10-terraform

      - name: Init
        run: terraform init -backend=false
        working-directory: week10-terraform

      - name: Validate
        run: terraform validate
        working-directory: week10-terraform
